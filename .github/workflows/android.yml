name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Gradle Wrapper files
        run: |
          echo "Working directory is: $(pwd)"
          echo "Listing root contents:"
          ls -R . | sed 's/^/  /'
          echo ""
          echo "Specifically, contents of gradle/wrapper/:"
          ls -l gradle/wrapper/ || echo "⛔ gradle/wrapper/ not found"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          echo "About to run: ./gradlew clean assembleDebug"
          ./gradlew clean assembleDebug

      - name: Upload Debug APK Artifact
        if: ${{ !github.head_ref }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: ${{ always() }}
        with:
          tag_name: debug-${{ github.run_number }}
          name: Debug APK
          body: Debug APK generated from GitHub Actions run
          draft: false
          prerelease: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
