name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Sanity-check: list out wrapper files so we can see what’s really in gradle/wrapper/
      - name: Check Gradle Wrapper files
        run: |
          echo "Working directory is: $(pwd)"
          echo "Listing root contents:"
          ls -R . | sed 's/^/  /'
          echo ""
          echo "Specifically, contents of gradle/wrapper/:"
          ls -l gradle/wrapper/ || echo "⛔ gradle/wrapper/ not found"

      # 3. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 4. Make the wrapper executable
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5. Clean and Build the Debug APK
      - name: Build Debug APK
        run: |
          echo "About to run: ./gradlew clean assembleDebug"
          ./gradlew clean assembleDebug

      # 6. Upload the generated APK (skip on PR runs)
      - name: Upload Debug APK Artifact
        if: ${{ !github.head_ref }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
